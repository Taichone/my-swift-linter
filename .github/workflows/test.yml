name: Test

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # このパッケージは swift-tools-version 6.3（swift-syntax 603 系）を要求する。
  # GitHub の macOS runner に同梱される Xcode より新しいため、swift.org から
  # 該当ツールチェーンを導入して使う。
  SWIFT_VERSION: '6.3.2'

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        run: |
          PKG_URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          curl -fsSL -o /tmp/swift.pkg "$PKG_URL"
          sudo installer -pkg /tmp/swift.pkg -target /
          TOOLCHAIN_ID=$(plutil -extract CFBundleIdentifier raw \
            "/Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain/Info.plist")
          echo "TOOLCHAINS=$TOOLCHAIN_ID" >> "$GITHUB_ENV"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
