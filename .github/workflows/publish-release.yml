name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: my-swift-linter
  # swift-tools-version 6.3（swift-syntax 603 系）を要求するため、swift.org の
  # ツールチェーンを導入して universal バイナリをビルドする。
  SWIFT_VERSION: '6.3.2'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: version must be in semver format (e.g. 0.1.0)" >&2
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Install Swift toolchain
        run: |
          PKG_URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          curl -fsSL -o /tmp/swift.pkg "$PKG_URL"
          sudo installer -pkg /tmp/swift.pkg -target /
          TOOLCHAIN_ID=$(plutil -extract CFBundleIdentifier raw \
            "/Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain/Info.plist")
          echo "TOOLCHAINS=$TOOLCHAIN_ID" >> "$GITHUB_ENV"

      - name: Show Swift version
        run: swift --version

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Create archive
        run: |
          cd .build/apple/Products/Release
          tar -czvf "${BINARY_NAME}-${VERSION}-darwin-universal.tar.gz" "${BINARY_NAME}"
          shasum -a 256 "${BINARY_NAME}-${VERSION}-darwin-universal.tar.gz" \
            > "${BINARY_NAME}-${VERSION}-darwin-universal.tar.gz.sha256"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          cd .build/apple/Products/Release
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            "${BINARY_NAME}-${VERSION}-darwin-universal.tar.gz" \
            "${BINARY_NAME}-${VERSION}-darwin-universal.tar.gz.sha256"
